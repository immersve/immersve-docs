get:
  tags:
    - accounts-custodial
  summary: Get detailed account info
  parameters:
    - $ref: '../../models/account-id-path.yaml'
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: './models/get-account-response.yaml'
      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
    default:
      description: 'Error'
      content:
        application/json:
          schema:
            $ref: '../../models/error-response-custodial.yaml'

      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
post:
  tags:
    - accounts-custodial
  summary: Update an Account
  parameters:
    - $ref: '../../models/account-id-path.yaml'
  requestBody:
    content:
      application/json:
        schema:
          $ref: './models/update-account-request.yaml'
    required: true
  responses:
    '200':
      description: 'Account updated'
      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
    default:
      description: 'Error'
      content:
        application/json:
          schema:
            $ref: '../../models/error-response-custodial.yaml'
      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
