type: object
title: ResolveLoginIdentitiesRequest
required:
  - walletAddresses
properties:
  walletAddresses:
    type: array
    description: |
      EVM wallet addresses to resolve. Addresses are normalized before
      lookup, so any casing is accepted; duplicate addresses are
      deduplicated.
    minItems: 1
    maxItems: 50
    items:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
      example: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
