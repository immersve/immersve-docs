post:
  tags:
    - cards-custodial
  summary: Close a card
  parameters:
    - $ref: '../../models/card-id-path.yaml'
  requestBody:
    content:
      application/json:
        schema:
          $ref: './models/close-card-request.yaml'
    required: true
  responses:
    '200':
      description: 'Card closed'
      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
    default:
      description: 'Error'
      content:
        application/json:
          schema:
            $ref: '../../models/error-response-custodial.yaml'
      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
