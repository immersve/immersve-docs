post:
  tags:
    - card
  summary: Freeze Card
  operationId: freeze-card
  description: Temporarily disable a card to decline all new payment requests.
  parameters:
    - $ref: "../../models/card-id-path.yaml"
  responses:
    "200":
      description: Successful operation
      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
    "400":
      description: Request fields are invalid
      content:
        application/json:
          schema:
            $ref: '../../models/api-error-400.yaml'
      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
    "403":
      description: |
        **CARD_ALREADY_FROZEN**
        Card is already frozen.
      content:
        application/json:
          schema:
            $ref: "../../models/api-error-403.yaml"
      headers:
        X-Request-Id:
          $ref: "../../models/x-request-id-header.yaml"
