post:
  tags:
    - card
  summary: Create Card
  operationId: create-card
  description: |
    Create a card under a specified card program and affiliated with a Funding Source.
    Returns an ID with which to retrieve card details.
  requestBody:
    content:
      application/json:
        schema:
          $ref: "./models/create-card-async-request.yaml"
    required: true
  responses:
    "200":
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: "./models/create-card-async-response.yaml"
    "403":
      description: |
        User is not allowed to perform the action with the reason stated in the `message`

        **FORBIDDEN**
        Insufficient permissions to perform the action.

        **LIVENESS_MISMATCH**
        Card program or cardholder have the wrong liveness for the request.

        **CARD_PROGRAM_INVALID**
        Card program does not belong to a partner this cardholder is associated with.

        **FUNDING_CHANNEL_INVALID**
        Funding channel cannot be used with this card program.

        **BETA_ACCESS_DENIED**
        Card program is in restricted access mode and cardholder doesn't have access granted.

        **KYC_REQUIRED**
        KYC profile is missing, does not have PASSED status, or does not match card program region. Use the spending prerequisites endpoint for more details.

        **CONTACT_EMAIL_REQUIRED**
        Cardholder does not have a contact email.

        **CONTACT_PHONE_REQUIRED**
        Cardholder does not have a contact phone.

        **EXPECTED_SPEND_PREREQ_REQUIRED**
        Cardholder has not completed the required expected spend prerequisite.

        **CARD_REGION_NOT_SUPPORTED**
        The cardholder's card region is not supported by the card program.

        **MAX_CARDS_EXCEEDED**
        Cardholder has reached the maximum number of cards allowed.

        **MAX_ACTIVE_CARDS_EXCEEDED**
        Cardholder has reached the maximum number of active cards allowed.

        **SHIPPING_COUNTRY_UNSUPPORTED**
        The shipping country is not supported for physical card creation.
      content:
        application/json:
          schema:
            $ref: "../../models/api-error-403.yaml"
    "400":
      description: |
        Request fields are invalid, or the request could not be processed for the reason stated in the `message`

        **SHIPPING_ADDRESS_REQUIRED**
        Card program is configured for physical cards but no shipping address was provided.

        **SHIPPING_METHOD_REQUIRED**
        Card program is configured for physical cards but no shipping method was provided.

        **LANGUAGE_REQUIRED**
        Card program is configured for physical cards but no carrier language was provided.

        **PHYSICAL_CARD_CONFIGURATION_INVALID**
        The combination of card program, region, shipping method, and carrier language is invalid.

        **SHIPPING_ADDRESS_LINE_TOO_LONG**
        A formatted shipping address line exceeds the maximum line length allowed for the card carrier.
      content:
        application/json:
          schema:
            $ref: '../../models/api-error-400.yaml'
