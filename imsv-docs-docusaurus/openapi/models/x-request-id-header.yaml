description: |
  Identifier Immersve assigns to this request. Every response carries it,
  including error responses. Log it with each call and quote it when
  contacting support so the request can be traced through Immersve's
  systems. The value is opaque and generated by Immersve; a value sent on
  the request is ignored.
schema:
  type: string
example: Root=1-68cf3a1c-3f8e2b1a9c4d5e6f7a8b9c0d
